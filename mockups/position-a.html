<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #131313;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 920px;
    background: #1b1b1b;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 22px 24px 20px;
    color: #fff;
  }
  /* ---------- top row ---------- */
  .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .pair { display: flex; align-items: center; gap: 12px; }
  .logos { display: flex; }
  .logos img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #1b1b1b; background: #2a2a2a; }
  .logos img + img { margin-left: -12px; }
  .pair-info { display: flex; flex-direction: column; gap: 6px; }
  .pair-name { display: flex; align-items: center; gap: 8px; }
  .pair-name .name { font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
  .badge {
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.55);
    background: #2b2b2b; border-radius: 6px; padding: 2px 7px;
  }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #4ade80; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.7); }
  /* sparkline */
  .chart { flex-shrink: 0; margin-top: 2px; }
  /* ---------- divider ---------- */
  .divider { height: 1px; background: rgba(255,255,255,0.07); margin: 18px -24px 16px; }
  /* ---------- stats row ---------- */
  .stats { display: flex; align-items: flex-end; }
  .stat { min-width: 150px; }
  .stat .v { font-size: 17px; font-weight: 600; }
  .stat .v.green { color: #4ade80; }
  .stat .l { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,0.45); display: flex; align-items: center; gap: 4px; }
  .stat .sub { font-size: 13px; color: rgba(255,255,255,0.45); margin-top: 2px; }
  .stat .sub b { color: rgba(255,255,255,0.9); font-weight: 600; }
  .actions { margin-left: auto; display: flex; gap: 10px; }
  .btn {
    border-radius: 12px; padding: 9px 22px; font-size: 14px; font-weight: 700; cursor: pointer; border: none;
  }
  .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.14); color: rgba(255,255,255,0.75); }
  .btn-gold { background: linear-gradient(135deg, #f5c542, #e8b923); color: #171717; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="pair">
        <div class="logos">
          <img src="../public/images/symbol/bnb.png" alt="">
          <img src="../public/images/symbol/usdt.png" alt="">
        </div>
        <div class="pair-info">
          <div class="pair-name">
            <span class="name">BNB / USDT</span>
            <span class="badge">V2</span>
            <span class="badge">0.25%</span>
          </div>
          <div class="status"><span class="dot"></span>提供中</div>
        </div>
      </div>
      <svg class="chart" width="300" height="72" viewBox="0 0 300 72" fill="none">
        <!-- dashed range lines -->
        <line x1="0" y1="14" x2="300" y2="14" stroke="rgba(255,255,255,0.25)" stroke-dasharray="3 4"/>
        <line x1="0" y1="52" x2="300" y2="52" stroke="rgba(255,255,255,0.18)" stroke-dasharray="3 4"/>
        <!-- price line -->
        <polyline
          points="0,46 12,44 22,48 34,42 44,45 56,40 66,43 78,38 88,41 100,36 110,40 122,34 132,38 144,32 154,36 166,30 176,34 188,28 198,32 210,26 220,30 232,24 242,28 254,22 264,26 276,20 288,18 300,15"
          stroke="#4ade80" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="300" cy="15" r="2.5" fill="#4ade80"/>
        <circle cx="300" cy="14" r="1.5" fill="rgba(255,255,255,0.6)"/>
      </svg>
    </div>

    <div class="divider"></div>

    <div class="stats">
      <div class="stat">
        <div class="v">US$0.123</div>
        <div class="l">頭寸</div>
      </div>
      <div class="stat">
        <div class="v">0.012%</div>
        <div class="l">池占比</div>
      </div>
      <div class="stat">
        <div class="v">0.25%</div>
        <div class="l">費率</div>
      </div>
      <div class="stat">
        <div class="sub"><b>0.001</b> BNB</div>
        <div class="sub"><b>0.586</b> USDT</div>
        <div class="l">存入</div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost">移除</button>
        <button class="btn btn-gold">添加</button>
      </div>
    </div>
  </div>
</body>
</html>
