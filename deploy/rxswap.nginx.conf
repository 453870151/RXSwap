# RXSwap 生产 Nginx 配置示例
#
# 放置方式（Debian/Ubuntu）：
#   sudo cp deploy/rxswap.nginx.conf /etc/nginx/sites-available/rxswap
#   sudo ln -s /etc/nginx/sites-available/rxswap /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书（Let's Encrypt，免费）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d swap.yourdomain.com
# （certbot 会自动改写本配置加上 443 + 证书路径，可不必手填下面 ssl_* 两行）
#
# 端口需与 ecosystem.config.cjs 里的 next start -p 保持一致（默认 3000）。

server {
    listen 80;
    server_name swap.yourdomain.com;   # ← 改成你的域名

    # 未配证书前可先注释下面这行，用 HTTP 调试；配好证书后启用强制跳转
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name swap.yourdomain.com;   # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/swap.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swap.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # Next.js 服务（pm2 守护，监听 3000）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源长缓存（由 next 提供，这里只加缓存头）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
